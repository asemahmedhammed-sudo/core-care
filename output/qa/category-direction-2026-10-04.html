<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category direction — local fixture</title><link rel="stylesheet" href="/public/app.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap"><style>.qa-bar{padding:16px;border-bottom:1px solid #ddd;margin-bottom:24px;font:14px sans-serif}.qa-neighbor{padding:16px;background:#fff;border:1px solid #e5e7eb;border-radius:8px}.qa-neighbor p{margin:0}#main-content{padding-bottom:24px}</style></head><body class="theme-beauty beauty-reference-home beauty-reference-font"><div class="qa-bar"><p>Local layout fixture · production CSS · Salla runtime unverified</p><a href="?dir=rtl">العربية</a> / <a href="?dir=ltr">English</a></div><main id="main-content"><section class="s-block container qa-neighbor" id="before"><p>Previous section · القسم السابق</p></section><span class="s-design-invisible-dom"></span><section data-testid="store-home-main-links" class="s-block container beauty-categories"><div class="beauty-section-heading"><h2></h2></div><ul class="beauty-categories__list" role="list"></ul></section><span class="s-design-invisible-dom"></span><section class="s-block container qa-neighbor" id="after"><p>Next section · القسم التالي</p></section></main><script>
const q=new URLSearchParams(location.search),dir=q.get('dir')==='ltr'?'ltr':'rtl';
document.documentElement.dir=dir; document.documentElement.lang=dir==='rtl'?'ar':'en';
const section=document.querySelector('.beauty-categories'),list=section.querySelector('ul'),heading=section.querySelector('.beauty-section-heading');
heading.querySelector('h2').textContent=dir==='rtl'?'تسوّقي حسب الفئة':'Shop by category';
if(q.has('no-title'))heading.remove();
let names=dir==='rtl'?['شامبو','مناكير','العطور']:['Shampoo','Nail polish','Perfumes'];
if(q.has('mixed'))names=['شامبو (Care 24)','Nail polish — مناكير','العطور Eau de parfum 100ml'];
if(q.has('long'))names=['العنايةبالشعروالبشرةوالأظافرمعأسماءطويلةجدًا','HairAndSkinCareWithVeryLongUnbrokenCategoryNames','العناية بالبشرة Skin care (24)'];
let count=q.has('count')?Number(q.get('count')):3;
for(let i=0;i<count;i++){
const li=document.createElement('li'),a=document.createElement('a'),media=document.createElement('span'),icon=document.createElement('i'),label=document.createElement('span'),bdi=document.createElement('bdi');
a.href='#after';a.className='beauty-category';media.className='beauty-category__image';icon.className='sicon-store';icon.setAttribute('aria-hidden','true');bdi.textContent=names[i%3];media.append(icon);label.append(bdi);a.append(media,label);li.append(a);list.append(li);
}
if(q.has('hidden'))section.hidden=true;
if(q.has('reorder'))document.querySelector('#main-content').append(section);
if(q.has('repeat'))section.after(section.cloneNode(true));
</script></body></html>
